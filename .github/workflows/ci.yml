name: CI

on:
  push:
    branches: [v6, main]
  pull_request:
    branches: [v6, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npx stylelint "src/**/*.css"

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Validate HTML
        run: npx html-validate "src/**/*.html"

      - name: Verify dist output
        run: |
          for f in \
            bullframe \
            bullframe-dark \
            bullframe-system-default \
            bullframe-classless \
            bullframe-classless-dark \
            bullframe-classless-system-default \
            bullframe-utilities
          do
            test -f "dist/css/${f}.css" || (echo "Missing ${f}.css" && exit 1)
            test -f "dist/css/${f}.min.css" || (echo "Missing ${f}.min.css" && exit 1)
          done
          test ! -e dist/css/bullframe-modern.css || (echo "Unexpected bullframe-modern.css" && exit 1)
          test ! -e dist/css/variables.css || (echo "Unexpected variables.css dist entry" && exit 1)
          test ! -e dist/css/utility-global-dark-prefers.css || (echo "Unexpected utility-global-dark-prefers.css dist entry" && exit 1)
          echo "All expected dist files present"

  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build (vite + sync-public + vitepress)
        run: npm run docs:build

      - name: Run visual tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
