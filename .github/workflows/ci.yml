name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npx stylelint "src/**/*.css"

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Build skills
        run: npm run skills:build

      - name: Validate skills
        run: npm run skills:check

      - name: Validate HTML
        run: npx html-validate "src/**/*.html"

      - name: Verify dist output
        run: |
          for f in \
            bullframe \
            bullframe-dark \
            bullframe-system-default \
            bullframe-classless \
            bullframe-classless-dark \
            bullframe-classless-system-default \
            bullframe-utilities
          do
            test -f "dist/css/${f}.css" || (echo "Missing ${f}.css" && exit 1)
            test -f "dist/css/${f}.min.css" || (echo "Missing ${f}.min.css" && exit 1)
          done
          test ! -e dist/css/bullframe-modern.css || (echo "Unexpected bullframe-modern.css" && exit 1)
          test ! -e dist/css/variables.css || (echo "Unexpected variables.css dist entry" && exit 1)
          test ! -e dist/css/utility-global-dark-prefers.css || (echo "Unexpected utility-global-dark-prefers.css dist entry" && exit 1)
          test -f dist/skills/index.json || (echo "Missing dist/skills/index.json" && exit 1)
          test -f dist/skills/api.json || (echo "Missing dist/skills/api.json" && exit 1)
          echo "All expected dist files present"

  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build (vite + sync-public + vitepress)
        run: npm run docs:build

      - name: Run visual tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
