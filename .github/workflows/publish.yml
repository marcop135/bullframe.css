name: Publish to npm

# Manual only. Releases do not publish automatically: the maintainer runs
# `npm publish --access public` from `develop`, or dispatches this
# workflow after `NPM_TOKEN` is set in Actions secrets. `--provenance` needs
# CI OIDC, so it only works here, not locally.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Publish locally from the release tag, or add the secret and re-dispatch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          for f in \
            bullframe \
            bullframe-dark \
            bullframe-system-default \
            bullframe-classless \
            bullframe-classless-dark \
            bullframe-classless-system-default \
            bullframe-utilities
          do
            test -f "dist/css/${f}.css" || (echo "Missing ${f}.css" && exit 1)
            test -f "dist/css/${f}.min.css" || (echo "Missing ${f}.min.css" && exit 1)
          done
          test ! -e dist/css/bullframe-modern.css || (echo "Unexpected bullframe-modern.css" && exit 1)

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
