name: Skills eval

# Manual only. This job calls a model, so it costs money and is not deterministic:
# it never gates a pull request. Run it before a release, or after editing a skill.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Single skill to evaluate (blank runs all)'
        required: false
        type: string
      model:
        description: 'Model id'
        required: false
        default: claude-sonnet-5
        type: string

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build skills
        run: npm run skills:build

      - name: Evaluate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/eval-skills.mjs \
            ${{ inputs.skill && format('--skill {0}', inputs.skill) || '' }} \
            --model "${{ inputs.model }}"
