<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact · Fieldnote</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bullframe.css" />
  </head>
  <body>
    <a class="bf-skip-link" href="#main-content">Skip to content</a>

    <main id="main-content" class="bf-container bf-container--break-md bf-p-b-4">
      <h1>Contact</h1>
      <p class="bf-lead">Tell us what you need. We reply within one business day.</p>

      <div class="bf-row">
        <div class="bf-col-7">
          <form action="/contact" method="post">
            <label for="contact-name">Name</label>
            <input id="contact-name" type="text" name="name" autocomplete="name" required />

            <label for="contact-email">Email</label>
            <input id="contact-email" type="email" name="email" autocomplete="email" required />

            <label for="contact-subject">Subject</label>
            <select id="contact-subject" name="subject" required>
              <option value="">Choose one&hellip;</option>
              <option value="sales">Sales</option>
              <option value="support">Support</option>
              <option value="other">Other</option>
            </select>

            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="5" aria-describedby="contact-message-hint" required></textarea>
            <p id="contact-message-hint"><small>Up to 2000 characters.</small></p>

            <fieldset>
              <legend>How should we reply?</legend>

              <input id="reply-email" type="radio" name="reply" value="email" checked />
              <label for="reply-email">By email</label>

              <input id="reply-phone" type="radio" name="reply" value="phone" />
              <label for="reply-phone">By phone</label>
            </fieldset>

            <p class="bf-m-t-2">
              <button type="submit" class="bf-btn bf-btn--primary">Send message</button>
            </p>
          </form>
        </div>

        <div class="bf-col-5">
          <aside style="border: 1px solid var(--bf-gray-light); border-radius: var(--bf-spacing-sm); padding: var(--bf-spacing-xl)">
            <h2 class="bf-m-t-0">Office</h2>
            <p>
              Via Example 12<br />
              00100 Rome, Italy
            </p>
            <h3>Hours</h3>
            <p class="bf-m-b-0">Mon to Fri, 09:00 to 18:00 CET</p>
          </aside>
        </div>
      </div>
    </main>
  </body>
</html>
