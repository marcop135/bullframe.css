# Netlify deployment config for the VitePress docs site.
# Live at https://bullframecss.marcopontili.com
#
# To activate:
#   1. In Netlify dashboard: "Add new site" -> "Import from GitHub" -> select bullframe.css.
#   2. Netlify auto-detects this file. Confirm the build settings below.
#   3. Add custom domain: bullframecss.marcopontili.com.
#   4. Subsequent pushes to v6 trigger production deploys automatically.
#
# For ad-hoc CLI deploys: `netlify deploy --prod` from the repo root after `npm run docs:build`.

[build]
  # Run from repo root so we can run the vite build (which compiles the CSS variants
  # and the demo) before the VitePress build, then sync the demo into the VitePress public
  # folder so it ships at /demo/.
  command = "npm ci && npm run docs:build"
  publish = "docs/.vitepress/dist/"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "npm ci && npm run docs:build"

# Interactive demo lives at /demo/ (static HTML from docs/public/demo/).
[[redirects]]
  from = "/demo"
  to = "/demo/"
  status = 301
  force = true

# Legacy live URL previously redirected / -> /dist/docs/demo/
[[redirects]]
  from = "/dist/docs/demo"
  to = "/demo/"
  status = 301

[[redirects]]
  from = "/dist/docs/demo/*"
  to = "/demo/:splat"
  status = 301

# Old Docusaurus-style /docs/* paths (e.g. README migration link).
[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
