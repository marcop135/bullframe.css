<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Examples · Bullframe CSS</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/kitchen-sink/icons/favicon-32x32.png" />
    <link rel="stylesheet" href="/css/bullframe.min.css" />
    <link rel="stylesheet" href="/examples/shared.css" />
    <link rel="stylesheet" href="custom.css" />
  </head>
  <body class="ex-signin">
    <header class="ex-bar">
      <div class="bf-container">
        <p><a href="/examples">← Examples</a> · <span class="ex-build">bullframe.min.css</span></p>
      </div>
    </header>
    <main class="ex-signin__main">
      <form class="ex-signin__card" action="#" method="post">
        <h1 class="bf-m-t-0">Log in</h1>
        <p>Welcome back.</p>

        <label for="login-email">Email</label>
        <input id="login-email" type="email" name="email" required autocomplete="email" />

        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          name="password"
          required
          autocomplete="current-password"
        />

        <p class="bf-m-t-2">
          <button type="submit" class="bf-btn bf-btn--primary" style="width: 100%">Log in</button>
        </p>
        <p class="bf-t-center bf-m-b-0"><a href="#">Forgot password?</a></p>
      </form>
    </main>
  </body>
</html>
